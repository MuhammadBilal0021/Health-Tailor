name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: healthtailor
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: healthtailor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthtailor -d healthtailor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://healthtailor:ci-only-password@localhost:5432/healthtailor_test
      TEST_DATABASE_URL: postgresql+psycopg://healthtailor:ci-only-password@localhost:5432/healthtailor_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: python manage.py seed-catalog
      - run: python manage.py seed-catalog
      - run: pytest -q
