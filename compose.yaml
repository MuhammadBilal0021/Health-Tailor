services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: healthtailor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: healthtailor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U healthtailor -d healthtailor]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://healthtailor:${POSTGRES_PASSWORD}@db:5432/healthtailor
      COOKIE_SECURE: 'false'
      FRONTEND_ORIGINS: http://localhost:3000
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: backend
    environment: *backend_env
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build: frontend
    ports: ['127.0.0.1:3000:3000']
    depends_on: [backend]
volumes:
  postgres_data:
