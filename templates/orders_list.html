<!DOCTYPE html>
<html>
<head>
    <title>All Orders</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #f4f4f4;
        }
        .btn {
            padding: 6px 12px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .status {
            font-weight: bold;
        }
    </style>
<link rel="stylesheet" href="{{ url_for('static', filename='polish.css') }}">
<script defer src="{{ url_for('static', filename='forms.js') }}"></script>
<meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>

<h2>📦 All Orders</h2>

<table>
    <thead>
        <tr>
            <th>Order #</th>
            <th>User</th>
            <th>Email</th>
            <th>Total</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        {% for order in orders %}
        <tr>
            <td>{{ order.order_number }}</td>
            <td>{{ order.user_name }}</td>
            <td>{{ order.user_email }}</td>
            <td>{{ order.total_amount }}</td>
            <td class="status">{{ order.status }}</td>
            <td>
                <a class="btn" href="{{ url_for('order_status', order_id=order.id) }}">
                    View / Update
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
