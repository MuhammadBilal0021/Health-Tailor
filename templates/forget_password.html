{% extends "_auth_base.html" %}
{% set title = "Forgot Password | Health Tailor" %}
{% block content %}
<div class="card auth-card p-4 p-md-5">
  <div class="text-center mb-3">
    <h3 class="fw-bold text-primary">Forgot your password?</h3>
    <p class="text-secondary mb-0">Enter your registered email to receive an 8-digit code.</p>
  </div>
  <form method="POST" novalidate onsubmit="return validateEmail()">
    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input type="email" class="form-control form-control-lg" name="email" id="email"
             placeholder="you@example.com" required>
      <div id="emailError" class="form-text text-danger d-none">Please enter a valid email.</div>
    </div>
    <button class="btn btn-gradient btn-lg w-100">Send Code</button>
  </form>
  <div class="text-center mt-3">
    <a href="{{ url_for('user_login') }}" class="text-decoration-none">Back to Login</a>
  </div>
</div>

<script>
function validateEmail(){
  const el = document.getElementById('email');
  const err = document.getElementById('emailError');
  const ok = /^[^@]+@[^@]+\.[^@]+$/.test(el.value.trim());
  err.classList.toggle('d-none', ok);
  return ok;
}
</script>
{% endblock %}
