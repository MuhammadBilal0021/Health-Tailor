<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Orders View</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align:left; }
    a { color:#2563eb; text-decoration:none; }
  </style>
<link rel="stylesheet" href="{{ url_for('static', filename='polish.css') }}">
<script defer src="{{ url_for('static', filename='forms.js') }}"></script>
<meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
  <h2>All Orders</h2>

  <table>
    <thead>
      <tr>
        <th>Order #</th>
        <th>Status</th>
        <th>User</th>
        <th>Created</th>
        <th>Open</th>
      </tr>
    </thead>
    <tbody>
      {% for o in orders %}
      <tr>
        <td>{{ o.order_number }}</td>
        <td>{{ o.status }}</td>
        <td>{{ o.user_email }}</td>
        <td>{{ o.created_at }}</td>
        <td><a href="{{ url_for('order_status', order_id=o.id) }}">Open</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
