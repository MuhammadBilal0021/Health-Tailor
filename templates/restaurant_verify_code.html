{% extends "_auth_base.html" %}
{% set title = "Restaurant | Verify Code" %}
{% block content %}
<div class="card auth-card p-4 p-md-5">
  <div class="text-center mb-3">
    <h3 class="fw-bold">Verify your code (Restaurant)</h3>
    <p class="text-secondary mb-0">We sent an 8-digit code to <strong>{{ email }}</strong>.</p>
    <p class="text-secondary">Expires in ~ {{ minutes_left }} minutes.</p>
  </div>
  <form method="POST" onsubmit="return validateCode()">
    <div class="mb-3 text-center">
      <input type="text" inputmode="numeric" maxlength="8"
             class="code-box" name="code" id="code" placeholder="________" autofocus required>
      <div id="codeError" class="form-text text-danger d-none mt-2">Enter 8 digits.</div>
    </div>
    <button class="btn btn-gradient btn-lg w-100">Verify Code</button>
  </form>

  <form method="POST" action="{{ url_for('restaurant_resend_code') }}" class="mt-3">
    <button class="btn btn-outline-secondary w-100">Resend Code</button>
  </form>

  <div class="text-center mt-3">
    <a href="{{ url_for('restaurant_forget_password') }}" class="text-decoration-none">Use a different email</a>
  </div>
</div>
<script>
function validateCode(){
  const c = document.getElementById('code');
  const err = document.getElementById('codeError');
  const ok = /^\d{8}$/.test(c.value.trim());
  err.classList.toggle('d-none', ok);
  return ok;
}
</script>
{% endblock %}
