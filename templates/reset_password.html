{% extends "_auth_base.html" %}
{% set title = "Reset Password | Health Tailor" %}
{% block content %}
<div class="card auth-card p-4 p-md-5">
  <div class="text-center mb-3">
    <h3 class="fw-bold">Set a new password</h3>
    <p class="text-secondary mb-0">For <strong>{{ email }}</strong></p>
  </div>
  <form method="POST" onsubmit="return checkStrength()">
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" class="form-control form-control-lg" id="pw" name="new_password" required>
      <div id="pwhint" class="form-text">
        Must be 8+ chars with uppercase, number, and special character.
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-control form-control-lg" id="pw2" name="confirm_password" required>
      <div id="pwerr" class="form-text text-danger d-none">Passwords don’t match.</div>
    </div>
    <button class="btn btn-gradient btn-lg w-100">Reset Password</button>
  </form>
  <div class="text-center mt-3">
    <a href="{{ url_for('user_login') }}" class="text-decoration-none">Back to Login</a>
  </div>
</div>

<script>
function checkStrength(){
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const err = document.getElementById('pwerr');

  const strong =
    pw.length >= 8 &&
    /[A-Z]/.test(pw) &&
    /[0-9]/.test(pw) &&
    /[^A-Za-z0-9]/.test(pw);

  if(!strong){
    alert("Password must be 8+ chars, include uppercase, number, and special character.");
    return false;
  }
  const match = pw === pw2;
  err.classList.toggle('d-none', match);
  return match;
}
</script>
{% endblock %}
