<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful - Health Tailor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='polish.css') }}">
<script defer src="{{ url_for('static', filename='forms.js') }}"></script>
<meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check-circle text-green-500 text-3xl"></i>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 mb-4">Registration Submitted Successfully!</h1>

        <p class="text-gray-600 mb-2">
            Thank you for registering your restaurant with Health Tailor.
        </p>

        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
            <div class="flex items-center">
                <i class="fas fa-clock text-yellow-500 mr-3"></i>
                <div class="text-left">
                    <p class="text-yellow-800 font-medium">Pending Approval</p>
                    <p class="text-yellow-700 text-sm">Your restaurant account is under review. You will be notified via email once it's activated.</p>
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <a href="{{ url_for('restaurant_login') }}"
               class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium block">
                <i class="fas fa-sign-in-alt mr-2"></i>Go to Restaurant Login
            </a>

            <a href="{{ url_for('home') }}"
               class="w-full bg-gray-200 text-gray-800 py-3 px-4 rounded-lg hover:bg-gray-300 transition-colors font-medium block">
                <i class="fas fa-home mr-2"></i>Back to Homepage
            </a>
        </div>
    </div>
</body>
</html>
